version: 2.1

cache_1: &cache_1
  key: npm-cache-01-{{ checksum "package-lock.json" }}
  paths:
    - ./node_modules
    - ./package-lock.json
    - ./examples/basic/node_modules
    - ./examples/binding/node_modules
    - ./examples/failure-strategy/node_modules
    - ./examples/opentelemetry/node_modules
    - ./examples/parallel/node_modules
    - ./packages/workit/node_modules
    - ./packages/workit-bpm-client/node_modules
    - ./packages/workit-core/node_modules
    - ./packages/workit-stepfunction-client/node_modules
    - ./packages/workit-types/node_modules

lint: &lint
  steps:
    - checkout
    - run:
        name: Create Checksum
        command: sh .circleci/checksum.sh /tmp/checksums.txt
    - run:
        name: Setup environment variables
        command: |
          echo "export CIRCLE_NODE_VERSION=\$(node --version | grep -oE 'v[0-9]+')" >> $BASH_ENV
          source $BASH_ENV
    - run:
        name: Log out node.js version
        command: |
          node --version
          echo "CIRCLE_NODE_VERSION=${CIRCLE_NODE_VERSION}"
    - restore_cache:
        keys:
          - npm-cache-01-{{ checksum "package-lock.json" }}
    - run:
        name: Install Dependencies
        command: npm ci
    - run:
        name: Debug ls
        command: |
          ls -Al /home/circleci/project/packages/workit-bpm-client
    - save_cache:
        <<: *cache_1
    - run:
        name: Compile code
        command: npm run build
    - run:
        name: test
        command: npm run lint

node_tests: &node_tests
  steps:
    - checkout
    - run:
        name: Setup environment variables
        command: |
          echo "export CIRCLE_NODE_VERSION=\$(node --version | grep -oE 'v[0-9]+')" >> $BASH_ENV
          source $BASH_ENV
    - run:
        name: Log out node.js version
        command: |
          node --version
          echo "CIRCLE_NODE_VERSION=${CIRCLE_NODE_VERSION}"
    - restore_cache:
        keys:
          - npm-cache-01-{{ checksum "package-lock.json" }}
    - run:
        name: Install Dependencies
        command: npm ci
    - save_cache:
        <<: *cache_1
    - run:
        name: Compile code
        command: npm run build
    - run:
        name: test
        command: npm run test

node_integraton_tests: &node_integraton_tests
  steps:
    - checkout
    - run:
        name: Setup environment variables
        command: |
          echo "export CIRCLE_NODE_VERSION=\$(node --version | grep -oE 'v[0-9]+')" >> $BASH_ENV
          source $BASH_ENV
    - run:
        name: Log out node.js version
        command: |
          node --version
          echo "CIRCLE_NODE_VERSION=${CIRCLE_NODE_VERSION}"
    - restore_cache:
        keys:
          - npm-cache-01-{{ checksum "package-lock.json" }}
    - run:
        name: Install Dependencies
        command: npm ci
    - save_cache:
        <<: *cache_1
    - run:
        name: Compile code
        command: npm run build
    - run:
        name: test
        command: npm run test:all

docs_filters: &docs_filters # Ignores any commit on any branch by default
  branches:
    ignore: gh-pages

workflows:
  version: 2
  test:
    jobs:
      - node20:
          filters: *docs_filters
      - nodelts:
          filters: *docs_filters
      - nodecurrent:
          filters: *docs_filters
      - lint:
          filters: *docs_filters
jobs:
  # Runs the tests
  node20:
    docker:
      - image: cimg/node:20.19
    <<: *node_tests
  nodelts:
    docker:
      - image: cimg/node:lts
    <<: *node_tests
  lint:
    docker:
      - image: cimg/node:current
    <<: *lint
  nodecurrent:
    docker:
      - image: cimg/node:current
    <<: *node_tests
